// Módulo nativo local (Expo Modules API): notificación con la cuenta atrás y
// avisos en segundo plano. Lo enlaza solo el autolinking de Expo porque está
// en apps/mobile/modules/ (ver docs/SEGUNDO_PLANO.md).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.sebastianzaruha.relojdearena'
version = '1.8.2'

android {
  namespace "com.sebastianzaruha.relojdearena.background"
  defaultConfig {
    versionCode 1
    versionName '1.8.2'
  }
  testOptions {
    // Robolectric necesita los recursos de Android para dibujar en la JVM.
    unitTests.includeAndroidResources = true
    unitTests.all {
      // `-Preloj.capturas=/ruta` guarda los PNG del reloj flotante (HourglassViewRenderTest).
      if (project.hasProperty('reloj.capturas')) systemProperty 'reloj.capturas', project.property('reloj.capturas')
    }
  }
}

dependencies {
  // Tests de TimerModel en la JVM (sin móvil): ./gradlew :background-timer:testDebugUnitTest
  testImplementation 'junit:junit:4.13.2'
  // Dibujar HourglassView de verdad en la JVM (Canvas nativo) y comprobar los píxeles.
  testImplementation 'org.robolectric:robolectric:4.14.1'
}
